name: Codex review trigger

# For a public repository: copy to .github/workflows/codex-review-trigger.yml instead of
# codex-review-trigger.yml. GitHub does not let a public repository use an action from a private
# one, so this carries the qwrnet/actions/codex-review-trigger action's step inline. Keep it
# identical to codex-review-trigger/action.yml (a test in qwrnet/actions checks the template);
# when the action changes, copy this file again.
#
# Asks the central gate in qwrnet/actions to review ready pull requests into the default branch
# (it posts the required `codex-review` check, a summary comment and inline findings), and to wake
# the runner VM for CI that runs without a review: draft pull requests and pushes to the default
# branch.
#
# This only names the pull request. It never checks out or runs the pull request's code, and a
# fork's pull request gets no secret, so it is not dispatched (the owner reviews those).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Decide and dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_DISPATCH_TOKEN }}
          CHECK_NAME: codex-review
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO_NAME: ${{ github.event.repository.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF: ${{ github.ref }}
          PR: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.ref }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          mode=""
          case "$EVENT" in
            push)
              # CI on a push to the default branch (a merge, say) runs on the VM with no review.
              [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ] && mode=wake ;;
            pull_request)
              if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
                echo "A fork's pull request: not dispatched (the owner reviews those)."
              elif [ "$BASE" != "$DEFAULT_BRANCH" ]; then
                echo "Into $BASE, not $DEFAULT_BRANCH: the gate does not review it."
              elif [ "$ACTION" = "edited" ] && [ "$BASE_CHANGED" != "true" ]; then
                echo "Only the title or description changed: nothing to do."
              elif [ "$DRAFT" = "true" ]; then
                # Drafts are not reviewed, but their CI still needs the VM.
                mode=wake
              else
                mode=review
              fi ;;
          esac
          if [ -z "$mode" ]; then
            echo "Nothing to dispatch."
            exit 0
          fi
          args=(-R qwrnet/actions --ref main -f repo="$REPO_NAME" -f mode="$mode")
          if [ "$mode" = review ]; then
            [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "No pull request number"; exit 1; }
            args+=(-f pr="$PR" -f check_name="$CHECK_NAME")
          elif [[ "$PR" =~ ^[1-9][0-9]*$ ]]; then
            args+=(-f pr="$PR")
          fi
          gh workflow run codex-review.yml "${args[@]}"
          echo "Dispatched $mode for $REPO_NAME${PR:+#$PR}: https://github.com/qwrnet/actions/actions/workflows/codex-review.yml"
